<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/account.css" />
</head>
<body>
  <div class="device">
    <div class="screen">

      <header class="appbar">
        <a class="back" href="#" aria-label="Go back">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <span class="progress__bar" style="width:100%"></span>
        </div>

        <span class="appbar__spacer" aria-hidden="true"></span>
      </header>

      <main class="content" role="main">
        <h1 class="title">Account</h1>

        <div class="group">
          <label class="field">
            <span class="field__label">Name</span>
            <input class="input" type="text" placeholder="">
          </label>

          <label class="field">
            <span class="field__label">Username</span>
            <input class="input" type="text" placeholder="">
          </label>

          <label class="field">
            <span class="field__label">Email</span>
            <input class="input" type="email" placeholder="">
          </label>
        </div>

        <div class="cta-wrap">
          <button class="btn btn--primary" type="button">SIGN IN</button>
        </div>

        <div class="group group--switches">
          <label class="switch-row">
            <span class="switch-row__label">Sound effects</span>
            <input class="switch__input" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>

          <label class="switch-row">
            <span class="switch-row__label">Animations</span>
            <input class="switch__input" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>

          <label class="switch-row">
            <span class="switch-row__label">Motivational messages</span>
            <input class="switch__input" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>

          <label class="switch-row">
            <span class="switch-row__label">Listening exercises</span>
            <input class="switch__input" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
          </label>
        </div>

        <nav class="links">
          <a class="link link--muted" href="#">LOGOUT</a>
          <a class="link link--danger" href="#">DELETE MY ACCOUNT</a>
        </nav>
      </main>

    </div>
  </div>
<script type="module" src="./scripts/account/index.js"></script>
</body>
</html>
