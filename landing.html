<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duolingo • Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/landing.css" />
</head>
<body>
  <div class="device">
    <div class="screen">

      <header class="brand" aria-label="duolingo">
        <img class="brand__mark" src="./assets/logo.png" alt="duolingo" width="28" height="28">
        <span class="brand__type">duolingo</span>
      </header>

      <main class="content" role="main">
        <figure class="art" aria-hidden="true">
          <img class="art__img" src="./assets/duo-mark.png" alt="duolingo">
        </figure>

        <h1 class="title">
          The free, fun, and<br>
          effective way to learn a<br>
          language!
        </h1>
      </main>

      <nav class="actions" aria-label="actions">
        <a class="btn btn--primary" href="#get-started">GET STARTED</a>
        <a class="btn btn--secondary" href="#signin">I ALREADY HAVE AN ACCOUNT</a>
      </nav>

    </div>
  </div>
  <script type="module" src="./scripts/landing/index.js"></script>
</body>
</html>
